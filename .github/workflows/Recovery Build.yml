name: OrangeFox R12 Samsung Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'Đường dẫn đồng bộ OrangeFox'
        required: true
        default: 'https://gitlab.com'
      MANIFEST_BRANCH:
        description: 'Nhánh mã nguồn (Bắt buộc 12.1 cho R12)'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Link GitHub chứa Device Tree của bạn'
        required: true
        default: 'https://github.com'
      DEVICE_TREE_BRANCH:
        description: 'Nhánh của Device Tree (ví dụ: fox_12.1 hoặc android-12.1)'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Thư mục đích đặt mã nguồn thiết bị'
        required: true
        default: 'device/samsung/a10'
      DEVICE_NAME:
        description: 'Mã thiết bị (Mã sản phẩm)'
        required: true
        default: 'a10'
      MAKEFILE_NAME:
        description: 'Tên tệp Makefile (Không kèm đuôi .mk)'
        required: true
        default: 'tw_a10'
      BUILD_TARGET:
        description: 'Phân vùng đích cần tạo thành phẩm'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
 
    - name: Kiểm tra mã nguồn kho lưu trữ
      uses: actions/checkout@v4

    - name: Giải phóng và Dọn dẹp không gian máy ảo
      uses: rokibhasansagar/slimhub_actions@main

    - name: Khởi tạo Thư mục Workspace
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Cấu hình Môi trường Biên dịch Android
      run: |
        sudo apt-get update && sudo apt-get install git aria2 python3 -y
        git clone https://gitlab.com
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Đồng bộ lõi OrangeFox R12 (Nhánh 12.1)
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        chmod +x orangefox_sync.sh
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Nạp Device Tree từ GitHub vào mã nguồn
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Thiết lập Bộ nhớ đệm (Swap Space 16GB cho R12)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Thực hiện Tiến trình Biên dịch R12
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE=Unofficial
        set -e
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Kiểm tra Thư mục Thành phẩm
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ || true

    - name: Tự động Đẩy file lên mục Releases của GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: OrangeFox-R12-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: R12-${{ github.run_id }}
        body: |
          Xây dựng thành công OrangeFox Recovery R12
          - Thiết bị: ${{ github.event.inputs.DEVICE_NAME }}
          - Nhánh lõi: OrangeFox ${{ github.event.inputs.MANIFEST_BRANCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
